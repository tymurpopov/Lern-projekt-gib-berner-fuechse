{% if product.quantity > 0 %}
<form
    class="cart-quantity-form"
    method="post"
    action="{{ url_for('cart_add', product_id=product.id) }}"
>
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <label for="quantity-{{ product.id }}">Anzahl</label>

    <input
        type="number"
        id="quantity-{{ product.id }}"
        name="quantity"
        value="1"
        min="1"
        max="{{ [product.quantity, 10000]|min }}"
        step="1"
        required
    >

    <button class="action-button" type="submit">
        In den Warenkorb
    </button>
</form>
{% else %}
<p><strong>Ausverkauft</strong></p>
{% endif %}
